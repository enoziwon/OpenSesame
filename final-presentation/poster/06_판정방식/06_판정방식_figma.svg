<g id="text">
<text xml:space="preserve" font-family="Noto Sans KR" y="70.2"><tspan x="65" font-size="34" font-weight="700" fill="#1F2D4D">06</tspan><tspan x="119.11" font-size="34" font-weight="700" fill="#1F2D4D">판정 방식과 근거</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="112.8"><tspan x="42" font-size="21" font-weight="400" fill="#657083">라벨에 적힌 글자만 근거로 미국 FDA 주요 알레르기 9가지를 판정한다. 같은 라벨이면 언제나 같은 결과가 나오고, 판정마다 근거 원재료와 이유가 붙는다.</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="171.5"><tspan x="53.09" font-size="20" font-weight="700" fill="#FFFFFF">1</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="173.99"><tspan x="88" font-size="26" font-weight="700" fill="#1F2D4D">실제 라벨로 만든 원재료 사전</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="219.3"><tspan x="42" font-size="21" font-weight="400" fill="#1F2D4D">HACCP 제품 </tspan><tspan font-size="21" font-weight="700" fill="#F5823C">15,451개</tspan><tspan font-size="21" font-weight="400" fill="#1F2D4D">의 포장지에서 원재료 이름 </tspan><tspan font-size="21" font-weight="700" fill="#F5823C">23,550개</tspan><tspan font-size="21" font-weight="400" fill="#1F2D4D">를 모았다. 그중 </tspan><tspan font-size="21" font-weight="700" fill="#F5823C">270개</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="251.84"><tspan x="42" font-size="21" font-weight="400" fill="#1F2D4D">항목은 식품공전·식품첨가물공전, 미국 FDA 문서, 식약처 품목제조보고 원문과</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="284.39"><tspan x="42" font-size="21" font-weight="400" fill="#1F2D4D">대조했다.</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="324.94"><tspan x="42" font-size="21" font-weight="400" fill="#1F2D4D">근거의 세기는 하위 원료까지 적힌 실제 라벨에서 센 비율로 정했다.</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="389.08"><tspan x="84.52" font-size="19" font-weight="700" fill="#1F2D4D">확정</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="387.68"><tspan x="156" font-size="20" font-weight="500" fill="#1F2D4D">이름이나 정의가 곧 알레르기 원료다</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="414.28"><tspan x="156" font-size="18" font-weight="400" fill="#657083">카제인나트륨은 우유, 참기름은 참깨</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="458.18"><tspan x="84.52" font-size="19" font-weight="700" fill="#1F2D4D">추정</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="456.78"><tspan x="156" font-size="20" font-weight="500" fill="#1F2D4D">대개 들어 있다 (절반 이상)</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="483.38"><tspan x="156" font-size="18" font-weight="400" fill="#657083">빵가루의 밀 </tspan><tspan font-size="18" font-weight="700" fill="#F5823C">99%</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="527.27"><tspan x="84.52" font-size="19" font-weight="700" fill="#1F2D4D">가능</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="525.87"><tspan x="156" font-size="20" font-weight="500" fill="#1F2D4D">드물지 않게 들어 있다 (열에 하나 이상)</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="552.47"><tspan x="156" font-size="18" font-weight="400" fill="#657083">전분의 밀 </tspan><tspan font-size="18" font-weight="700" fill="#F5823C">35%</tspan><tspan font-size="18" font-weight="400" fill="#657083">, 육수의 생선 </tspan><tspan font-size="18" font-weight="700" fill="#F5823C">12%</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="171.5"><tspan x="841.09" font-size="20" font-weight="700" fill="#FFFFFF">2</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="173.99"><tspan x="876" font-size="26" font-weight="700" fill="#1F2D4D">한국 알레르기 표시란을 증거로 쓴다</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="219.3"><tspan x="830" font-size="21" font-weight="400" fill="#1F2D4D">한국은 알레르기 원료 </tspan><tspan font-size="21" font-weight="700" fill="#F5823C">19가지</tspan><tspan font-size="21" font-weight="400" fill="#1F2D4D">를 양과 관계없이 표시하게 한다. 그래서 표시란에 적힌</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="251.84"><tspan x="830" font-size="21" font-weight="400" fill="#1F2D4D">알레르기는 원재료명에 보이지 않아도 Contains로 판정한다(대두만 예외). 표시란이</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="284.39"><tspan x="830" font-size="21" font-weight="400" fill="#1F2D4D">전부 덮는 알레르기가 표시란에 없으면 추정과 가능 근거를 지운다.</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="335.74"><tspan x="830" font-size="18" font-weight="500" fill="#657083">전부 덮음</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="336.14"><tspan x="974" font-size="20" font-weight="700" fill="#FFFFFF">우유</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="336.14"><tspan x="1052.81" font-size="20" font-weight="700" fill="#FFFFFF">달걀</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="336.14"><tspan x="1131.63" font-size="20" font-weight="700" fill="#FFFFFF">밀</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="336.14"><tspan x="1192.03" font-size="20" font-weight="700" fill="#FFFFFF">대두</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="336.14"><tspan x="1270.84" font-size="20" font-weight="700" fill="#FFFFFF">땅콩</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="387.74"><tspan x="830" font-size="18" font-weight="500" fill="#657083">일부만 덮음</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="388.14"><tspan x="974" font-size="20" font-weight="700" fill="#1F2D4D">생선</tspan><tspan x="1016.81" font-size="16" font-weight="500" fill="#F5823C">고등어만</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="388.14"><tspan x="1117.7" font-size="20" font-weight="700" fill="#1F2D4D">갑각류</tspan><tspan x="1178.91" font-size="16" font-weight="500" fill="#F5823C">게·새우만</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="388.14"><tspan x="1288.98" font-size="20" font-weight="700" fill="#1F2D4D">견과류</tspan><tspan x="1350.19" font-size="16" font-weight="500" fill="#F5823C">호두·잣만</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="439.74"><tspan x="830" font-size="18" font-weight="500" fill="#657083">덮지 않음</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="440.14"><tspan x="974" font-size="20" font-weight="700" fill="#657083">참깨</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="485.54"><tspan x="830" font-size="19" font-weight="400" fill="#657083">일부만 덮거나 덮지 않는 알레르기는 원재료명을 직접 읽어 판단한다. 이렇게 정리한 뒤 확정</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="514.04"><tspan x="830" font-size="19" font-weight="400" fill="#657083">근거가 있으면 Contains, 추정이나 가능 근거만 남으면 May contain이다.</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="631.04"><tspan x="53.09" font-size="20" font-weight="700" fill="#FFFFFF">3</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="633.54"><tspan x="88" font-size="26" font-weight="700" fill="#1F2D4D">예외는 법과 자료로 정했다</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="694.84"><tspan x="62" font-size="21" font-weight="700" fill="#1F2D4D">정제 대두유</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="729.79"><tspan x="62" font-size="19" font-weight="400" fill="#1F2D4D">미국은 고도 정제유를 알레르기로 세지</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="758.29"><tspan x="62" font-size="19" font-weight="400" fill="#1F2D4D">않는다. 그래서 대두유만 있으면 세지</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="786.79"><tspan x="62" font-size="19" font-weight="400" fill="#1F2D4D">않고, 식물성유지처럼 어떤 기름인지</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="815.29"><tspan x="62" font-size="19" font-weight="400" fill="#1F2D4D">모르면 May contain으로 둔다.</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="849.19"><tspan x="62" font-size="17" font-weight="400" fill="#657083">한국에서는 대두유만 쓴 제품도 </tspan><tspan font-size="17" font-weight="700" fill="#F5823C">97%</tspan><tspan font-size="17" font-weight="400" fill="#657083">가</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="873.83"><tspan x="62" font-size="17" font-weight="400" fill="#657083">표시란에 대두를 적었다</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="694.84"><tspan x="452.5" font-size="21" font-weight="700" fill="#1F2D4D">속을 알 수 없는 양념</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="729.79"><tspan x="452.5" font-size="19" font-weight="400" fill="#1F2D4D">하위 원료 없이 적힌 양념·소스는</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="758.29"><tspan x="452.5" font-size="19" font-weight="400" fill="#1F2D4D">생선이나 참깨가 숨어 있던 비율이 </tspan><tspan font-size="19" font-weight="700" fill="#F5823C">2%</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="786.79"><tspan x="452.5" font-size="19" font-weight="400" fill="#1F2D4D">이상인 계열만 May contain으로 둔다.</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="820.69"><tspan x="452.5" font-size="17" font-weight="400" fill="#657083">양념의 참깨 </tspan><tspan font-size="17" font-weight="700" fill="#F5823C">6.1%</tspan><tspan font-size="17" font-weight="400" fill="#657083">, 시즈닝의 참깨 </tspan><tspan font-size="17" font-weight="700" fill="#F5823C">0.2%</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="694.84"><tspan x="843" font-size="21" font-weight="700" fill="#1F2D4D">이름에 속기 쉬운 원료</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="729.79"><tspan x="843" font-size="19" font-weight="400" fill="#1F2D4D">땅콩호박은 땅콩이 아니고, 코코넛밀크는</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="758.29"><tspan x="843" font-size="19" font-weight="400" fill="#1F2D4D">우유도 견과류도 아니다. 보리와 메밀은</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="786.79"><tspan x="843" font-size="19" font-weight="400" fill="#1F2D4D">밀이 아니며, 크릴은 갑각류다.</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="820.69"><tspan x="843" font-size="17" font-weight="400" fill="#657083">미국 FDA의 알레르기 범위를 따른다</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="694.84"><tspan x="1233.5" font-size="21" font-weight="700" fill="#1F2D4D">같은 시설 문구와 모르는 이름</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="729.79"><tspan x="1233.5" font-size="19" font-weight="400" fill="#1F2D4D">같은 시설 문구는 원재료가 아니어서</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="758.29"><tspan x="1233.5" font-size="19" font-weight="400" fill="#1F2D4D">판정에 쓰지 않고 따로 안내한다. 사전에</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="786.79"><tspan x="1233.5" font-size="19" font-weight="400" fill="#1F2D4D">없는 이름은 없다고 단정하지 않고 따로</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="815.29"><tspan x="1233.5" font-size="19" font-weight="400" fill="#1F2D4D">알린다.</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="194.49"><tspan x="1656" font-size="18" font-weight="700" fill="#FFFFFF">예시</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="197.9"><tspan x="1713.13" font-size="26" font-weight="700" fill="#1F2D4D">실제 라벨 한 장: 즉석 카레</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="235.69"><tspan x="1644" font-size="19" font-weight="400" fill="#657083">위의 규칙을 실제 제품 라벨에 그대로 적용한 결과다.</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="300.79"><tspan x="1664" font-size="20" font-weight="700" fill="#1F2D4D">원재료명</tspan><tspan x="1743.61" font-size="20" font-weight="400" fill="#1F2D4D">정제수, 양파, 카레1(</tspan><tspan x="1916.63" font-size="20" font-weight="700" fill="#1F2D4D">식물성유지</tspan><tspan x="2012.63" font-size="20" font-weight="400" fill="#1F2D4D">, </tspan><tspan x="2027.8" font-size="20" font-weight="700" fill="#1F2D4D">밀가루</tspan><tspan x="2087" font-size="20" font-weight="400" fill="#1F2D4D">, 정백당, 정제염, 강황가루),</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="335.79"><tspan x="1664" font-size="20" font-weight="400" fill="#1F2D4D">단호박, </tspan><tspan x="1734.38" font-size="20" font-weight="700" fill="#1F2D4D">카레맛소스</tspan><tspan x="1830.38" font-size="20" font-weight="400" fill="#1F2D4D">, 마늘, 카레2(</tspan><tspan x="1948.2" font-size="20" font-weight="700" fill="#1F2D4D">밀가루</tspan><tspan x="2007.41" font-size="20" font-weight="400" fill="#1F2D4D">, 돈지, 설탕, 향신료가공품, 정제수),</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="370.79"><tspan x="1664" font-size="20" font-weight="400" fill="#1F2D4D">새싹분말[</tspan><tspan x="1748.38" font-size="20" font-weight="400" fill="#657083">보리새싹</tspan><tspan x="1825.98" font-size="20" font-weight="400" fill="#1F2D4D"> …], </tspan><tspan x="1873.53" font-size="20" font-weight="400" fill="#657083">코코넛밀크</tspan><tspan x="1969.53" font-size="20" font-weight="400" fill="#1F2D4D">, 강황분말</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="413.79"><tspan x="1664" font-size="20" font-weight="700" fill="#1F2D4D">알레르기 표시란</tspan><tspan x="1808.41" font-size="20" font-weight="700" fill="#1F2D4D">밀</tspan><tspan x="1830.81" font-size="20" font-weight="400" fill="#1F2D4D">, 토마토, </tspan><tspan x="1912.36" font-size="20" font-weight="700" fill="#1F2D4D">대두</tspan><tspan x="1953.17" font-size="20" font-weight="400" fill="#1F2D4D">, </tspan><tspan x="1968.34" font-size="20" font-weight="700" fill="#1F2D4D">우유</tspan><tspan x="2009.16" font-size="20" font-weight="400" fill="#1F2D4D">, 돼지고기 함유</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="466.59"><tspan x="1694" font-size="17" font-weight="400" fill="#657083">Contains 근거</tspan><tspan x="1848.11" font-size="17" font-weight="400" fill="#657083">May contain 근거</tspan><tspan x="2028.63" font-size="17" font-weight="400" fill="#657083">이름만 비슷해 세지 않음</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="552.19"><tspan x="1701.72" font-size="19" font-weight="700" fill="#1F2D4D">Contains</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="553.59"><tspan x="1838" font-size="20" font-weight="700" fill="#1F2D4D">밀</tspan><tspan x="1864.41" font-size="20" font-weight="400" fill="#1F2D4D">원재료에 밀가루가 있다.</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="606.79"><tspan x="1701.72" font-size="19" font-weight="700" fill="#1F2D4D">Contains</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="608.18"><tspan x="1838" font-size="20" font-weight="700" fill="#1F2D4D">우유</tspan><tspan x="1882.81" font-size="20" font-weight="400" fill="#1F2D4D">원재료명에는 없지만 표시란에 있다.</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="661.38"><tspan x="1686.14" font-size="19" font-weight="700" fill="#1F2D4D">May contain</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="662.78"><tspan x="1838" font-size="20" font-weight="700" fill="#1F2D4D">대두</tspan><tspan x="1882.81" font-size="20" font-weight="400" fill="#1F2D4D">표시란의 대두가 식물성유지 때문일 수 있다.</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="715.98"><tspan x="1686.14" font-size="19" font-weight="700" fill="#1F2D4D">May contain</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="717.37"><tspan x="1838" font-size="20" font-weight="700" fill="#1F2D4D">생선, 참깨</tspan><tspan x="1931.73" font-size="20" font-weight="400" fill="#1F2D4D">카레맛소스의 속을 알 수 없다.</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="770.57"><tspan x="1682.59" font-size="19" font-weight="700" fill="#1F2D4D">Not detected</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="771.97"><tspan x="1838" font-size="20" font-weight="700" fill="#1F2D4D">달걀, 땅콩, 갑각류, 견과류</tspan><tspan x="2066.38" font-size="20" font-weight="400" fill="#1F2D4D">근거를 찾지 못했다.</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="838.16"><tspan x="1644" font-size="19" font-weight="400" fill="#657083">코코넛밀크와 보리새싹은 이름만 비슷해서 세지 않는다. 토마토와 돼지고기는 미국 9가지</tspan></text>
<text xml:space="preserve" font-family="Noto Sans KR" y="866.66"><tspan x="1644" font-size="19" font-weight="400" fill="#657083">밖이다.</tspan></text>
</g>
